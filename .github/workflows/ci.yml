name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Una tanda por rama: si llegan dos pushes seguidos, cancela la anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pruebas de integración
    runs-on: ubuntu-latest

    # Postgres efímero del runner: se crea y se destruye con el job.
    # Deliberadamente NO se usa Supabase — las pruebas borran datos, y dos
    # tandas simultáneas sobre la misma base se pisarían.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weedtown_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/weedtown_ci?schema=weedtown_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/weedtown_ci?schema=weedtown_test
      PORT: 4010
      BACKEND_URL: http://localhost:4010
      FRONTEND_URL: http://localhost:3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Generar el cliente de Prisma
        working-directory: backend
        run: npx prisma generate

      # Secreto de un solo uso: la base y el runner se destruyen con el job,
      # así que no hay nada que guardar en los secrets del repositorio.
      - name: Generar JWT_SECRET de la tanda
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Pruebas
        working-directory: backend
        run: npm test

  frontend:
    name: Frontend · compilación
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      # CI=true convierte los warnings de ESLint en error: una variable sin usar
      # o un hook con dependencias incompletas rompen la tanda.
      - name: Compilar
        working-directory: frontend
        env:
          CI: true
        run: npm run build
