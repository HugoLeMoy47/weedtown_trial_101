name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Una tanda por rama: si llegan dos pushes seguidos, cancela la anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · pruebas de integración
    runs-on: ubuntu-latest

    # Postgres efímero del runner: se crea y se destruye con el job.
    # Deliberadamente NO se usa Supabase — las pruebas borran datos, y dos
    # tandas simultáneas sobre la misma base se pisarían.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weedtown_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/weedtown_ci?schema=weedtown_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/weedtown_ci?schema=weedtown_test
      PORT: 4010
      BACKEND_URL: http://localhost:4010
      FRONTEND_URL: http://localhost:3000
      # apiLimiter (app.js) es 300/15min en producción — el presupuesto de UNA
      # persona usuaria. Acá es el presupuesto de la suite entera contra un solo
      # proceso del backend, y ya no alcanza. No afecta producción.
      API_LIMITER_MAX: 5000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      # Solo el backend: hoy está en 0 avisos (ciclo 8E), así que un aviso
      # alto nuevo aquí es señal real, no ruido. El frontend queda fuera a
      # propósito — hereda altos/críticos del toolchain de Create React App
      # (deuda de fondo documentada en la auditoría, fuera de este ciclo) y
      # este gate fallaría de inmediato sin decir nada nuevo.
      - name: Auditar dependencias (solo altas/críticas)
        working-directory: backend
        run: npm audit --audit-level=high

      - name: Generar el cliente de Prisma
        working-directory: backend
        run: npx prisma generate

      # Secreto de un solo uso: la base y el runner se destruyen con el job,
      # así que no hay nada que guardar en los secrets del repositorio.
      - name: Generar JWT_SECRET de la tanda
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Pruebas
        working-directory: backend
        run: npm test

  # Ciclo 12A. Las specs de Playwright existían desde el ciclo 1, pasaban en
  # local y NO PROTEGÍAN NADA en cada push — el mismo patrón que el 7E cazó
  # para las unitarias del frontend. El 8C lo documentó con honestidad en el
  # README, pero documentar un hueco no lo cierra.
  #
  # Va en su propio job, no pegado al de backend: tarda más que los otros dos y
  # así no retrasa la señal rápida. Mismo Postgres efímero, misma razón — las
  # specs borran datos.
  e2e:
    name: E2E · navegador real
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: weedtown_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/weedtown_e2e?schema=weedtown_test
      DIRECT_URL: postgresql://postgres:postgres@localhost:5432/weedtown_e2e?schema=weedtown_test
      API_LIMITER_MAX: 5000
      # Un navegador de verdad hace muchas más peticiones que la suite de
      # integración, y todas desde la misma IP.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: |
          npm ci --prefix backend
          npm ci --prefix frontend
          npm ci --prefix e2e

      - name: Generar el cliente de Prisma
        working-directory: backend
        run: npx prisma generate

      # `--with-deps` instala las librerías del sistema que Chromium necesita
      # en el runner. Sin eso, el navegador arranca y muere sin explicar nada.
      - name: Instalar Chromium para Playwright
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Generar JWT_SECRET de la tanda
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      # e2e/run.js detecta CI: toma el entorno inyectado en vez de .env.test, y
      # sirve el frontend COMPILADO en vez del servidor de desarrollo.
      - name: Ciclo E2E completo
        working-directory: e2e
        run: npm test

      # Las trazas y capturas solo se generan al fallar (playwright.config.js).
      # Sin esto, un fallo en CI es un mensaje sin nada que mirar.
      - name: Guardar evidencia si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidencia
          path: e2e/test-results/
          retention-days: 7

  frontend:
    name: Frontend · compilación
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      # CI=true hace que react-scripts test corra una vez y salga (sin watch
      # mode, que es el default fuera de CI y dejaría el job colgado para
      # siempre). Sin este paso, worker.test.js (HU-SEC-001: que la inyección
      # de HTML en /p/:id salga inerte) y rutaInterna.test.js nunca corrían en
      # CI — la única defensa automática contra esa inyección no protegía nada.
      - name: Pruebas
        working-directory: frontend
        env:
          CI: true
        run: npm test

      # CI=true TAMBIÉN convierte los warnings de ESLint en error acá: una
      # variable sin usar o un hook con dependencias incompletas rompen la
      # tanda.
      - name: Compilar
        working-directory: frontend
        env:
          CI: true
        run: npm run build
