# Ciclo 19C. Dependabot abre un pull request por semana con las actualizaciones
# de cada proyecto, agrupadas para no inundar. Cada PR pasa por el CI como
# cualquier otro cambio, así que una actualización que rompa algo se ve ANTES de
# llegar a `main`.
version: 2

updates:
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    ignore:
      # Un salto de versión mayor (Express 5, Prisma 7, React 19, Vitest 5…) es
      # una decisión y un ciclo propio, no un PR automático. La primera semana
      # de Dependabot abrió seis de golpe; aquí se dejan fuera a propósito.
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    # `react-router-dom` queda fijo en la serie 6.x (postura, no deuda: ciclo
    # 12D); lo cubre esta regla de saltos mayores.
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: npm
    directory: /e2e
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 2
    groups:
      menores-y-parches:
        update-types: [minor, patch]
    ignore:
      - dependency-name: '*'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
