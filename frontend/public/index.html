<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />

         iOS y todo el CSS de área segura de la barra de navegación móvil (ciclo 3)
         no hace nada, en silencio — la barra queda debajo del indicador de inicio. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="WeedTown — la red social de la comunidad cannábica de México. Un espacio seguro, con respeto y sin estigma." />
    <meta name="theme-color" content="#33691e" />
    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/logo.svg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/logo.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Nunito:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet" />
    <title>WeedTown</title>
  </head>
  <body>

    <div id="root"></div>

</html>
